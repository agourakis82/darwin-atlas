name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Scientific contract and fail-closed boundary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate normative documents and JSON syntax
        run: make contract

      - name: Assert canonical pipeline cannot fall back to Julia
        run: |
          set +e
          make pipeline
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Preserve locked Julia environment
        run: |
          test -f julia/Manifest.toml
          ! rg -n 'rm -rf julia/[M]anifest.toml' Makefile

  test-julia-validator:
    name: Julia validator development — ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install locked dependencies
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run validator-development tests
        run: make test-julia

  sounio-official-fixture:
    name: Official pinned Sounio executable fixtures
    runs-on: ubuntu-latest
    needs: contract

    steps:
      - name: Checkout Darwin Atlas
        uses: actions/checkout@v4
        with:
          path: atlas

      - name: Resolve pinned official Sounio commit
        id: pin
        working-directory: atlas
        run: echo "commit=$(ruby -rjson -e 'print JSON.parse(File.read("toolchains/sounio.lock.json")).fetch("commit")')" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned official Sounio
        uses: actions/checkout@v4
        with:
          repository: sounio-lang/sounio
          ref: ${{ steps.pin.outputs.commit }}
          path: sounio-upstream
          sparse-checkout: |
            bin
            scripts/lib
            tools/science_boundary

      - name: Setup Julia oracle
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Check, compile, execute, and independently validate the operator fixture
        working-directory: atlas
        run: SOUNIO_REPO="$GITHUB_WORKSPACE/sounio-upstream" make operator-differential-fixture

      - name: Stream FASTA fixtures and independently validate IUPAC and errors
        working-directory: atlas
        run: SOUNIO_REPO="$GITHUB_WORKSPACE/sounio-upstream" make fasta-differential-fixture

      - name: Run frozen mini-pipeline (k = 1..8, dual kernel) and independently validate positional + masked k-mer JSONL
        working-directory: atlas
        run: SOUNIO_REPO="$GITHUB_WORKSPACE/sounio-upstream" make mini-pipeline-differential-fixture

  cross-validation-boundary:
    name: Missing Sounio is blocked, never a pass
    runs-on: ubuntu-latest
    needs: test-julia-validator

    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install locked dependencies
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Require blocked exit when the Sounio producer is absent
        run: |
          set +e
          julia --project=julia julia/scripts/cross_validation.jl
          rc=$?
          set -e
          test "$rc" -eq 2
